<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Formulaire Produit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container my-5">
        <h2 class="text-center mb-4" th:text="${produit.id} ? 'Modifier le Produit' : 'Nouveau Produit'">Titre</h2>

        <form action="#" th:action="@{/enregistrer}" th:object="${produit}" method="POST"
            class="w-50 mx-auto border p-4 rounded shadow-sm">
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label class="form-label">Nom du Thé</label>
                <input type="text" th:field="*{nom}" class="form-control" placeholder="Nom du produit" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Type de Thé</label>
                <select th:field="*{typeThe}" class="form-select">
                    <option value="Vert">Vert</option>
                    <option value="Noir">Noir</option>
                    <option value="Blanc">Blanc</option>
                    <option value="Oolong">Oolong</option>
                    <option value="Rooibos">Rooibos</option>
                    <option value="Herbal">Tisane</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Origine</label>
                <select th:field="*{origine}" class="form-select">
                    <option value="Chine">Chine</option>
                    <option value="Inde">Inde</option>
                    <option value="Japon">Japon</option>
                    <option value="Sri Lanka">Sri Lanka</option>
                    <option value="Kenya">Kenya</option>
                    <option value="Autre">Autre</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Prix (€)</label>
                <input type="number" step="0.01" th:field="*{prix}" class="form-control" placeholder="Prix" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Quantité en Stock</label>
                <input type="number" th:field="*{quantiteStock}" class="form-control" placeholder="Quantité" />
            </div>

            <div class="mb-3">
                <label class="form-label">Date de Réception</label>
                <input type="date" th:field="*{dateReception}" class="form-control" />
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea th:field="*{description}" class="form-control" rows="3"
                    placeholder="Description du produit"></textarea>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-success">Enregistrer</button>
                <a th:href="@{/}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
